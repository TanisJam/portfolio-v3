<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-label="Growth is not a ramp. It is pulses that take turns.">
<title>Growth is not a ramp. It is pulses that take turns.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A2926"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2C9174"/></marker></defs>
<text x="26" y="26" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2A2926" text-anchor="start" font-weight="700" font-style="normal">Growth is not a ramp. It is pulses that take turns.</text>
<text x="26" y="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#8A857C" text-anchor="start" font-weight="400" font-style="normal">In citrus the root stops while the shoot grows. Never both at once.</text>
<line x1="52" y1="242" x2="712" y2="242" stroke="#2A2926" stroke-width="1.5"/>
<line x1="52" y1="74" x2="52" y2="242" stroke="#2A2926" stroke-width="1.5"/>
<text x="44" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8A857C" text-anchor="end" font-weight="400" font-style="normal">1</text>
<text x="44" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8A857C" text-anchor="end" font-weight="400" font-style="normal">0</text>
<text x="712" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8A857C" text-anchor="end" font-weight="400" font-style="normal">scroll  p</text>
<line x1="52" y1="242" x2="712" y2="74" stroke="#8A857C" stroke-width="1.3" stroke-dasharray="5 5"/>
<text x="395.2" y="137.84" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#8A857C" text-anchor="middle" font-weight="400" font-style="italic">the ramp you would invent</text>
<path d="M 52.0 242.0 L 134.5 200.0 L 134.5 200.0 L 217.0 200.0 L 217.0 200.0 L 299.5 158.0 L 299.5 158.0 L 382.0 158.0 L 382.0 158.0 L 464.5 116.0 L 464.5 116.0 L 547.0 116.0 L 547.0 116.0 L 629.5 74.0 L 629.5 74.0 L 712.0 74.0" fill="none" stroke="#2C9174" stroke-width="2.4"/>
<text x="722" y="79.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2C9174" text-anchor="start" font-weight="400" font-style="normal">root</text>
<path d="M 52.0 242.0 L 134.5 242.0 L 134.5 242.0 L 217.0 208.4 L 217.0 208.4 L 299.5 208.4 L 299.5 208.4 L 382.0 174.8 L 382.0 174.8 L 464.5 174.8 L 464.5 174.8 L 547.0 141.2 L 547.0 141.2 L 629.5 141.2 L 629.5 141.2 L 712.0 107.6" fill="none" stroke="#DD266E" stroke-width="2.4"/>
<text x="722" y="112.6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#DD266E" text-anchor="start" font-weight="400" font-style="normal">shoot</text>
<text x="26" y="294" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#8A857C" text-anchor="start" font-weight="400" font-style="normal">The plateaus are not an aesthetic license: they are physiology. And later they make the two</text>
<text x="26" y="312" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#8A857C" text-anchor="start" font-weight="400" font-style="normal">sound layers take turns on their own, with nobody programming it.</text>
</svg>
