<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 236" width="800" height="236" role="img" aria-label="The invisible loop">
<title>The invisible loop</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A2926"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2C9174"/></marker></defs>
<text x="26" y="26" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2A2926" text-anchor="start" font-weight="700" font-style="normal">The invisible loop</text>
<text x="26" y="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#8A857C" text-anchor="start" font-weight="400" font-style="normal">The final stretch renders exactly the same pixels as the opening one.</text>
<line x1="60" y1="120" x2="720" y2="120" stroke="#2A2926" stroke-width="2"/>
<line x1="60" y1="113" x2="60" y2="127" stroke="#2A2926" stroke-width="2"/>
<text x="60" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8A857C" text-anchor="middle" font-weight="400" font-style="normal">p = 0</text>
<line x1="720" y1="113" x2="720" y2="127" stroke="#2A2926" stroke-width="2"/>
<text x="720" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8A857C" text-anchor="middle" font-weight="400" font-style="normal">p = 1</text>
<rect x="60" y="107" width="33.0" height="26" fill="#2C9174" opacity=".55"/>
<rect x="687.0" y="107" width="33.00000000000003" height="26" fill="#2C9174" opacity=".55"/>
<text x="76.5" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2C9174" text-anchor="middle" font-weight="400" font-style="normal">same drawing</text>
<text x="703.5" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#2C9174" text-anchor="middle" font-weight="400" font-style="normal">same drawing</text>
<path d="M720 160 C 522.0 212, 225.0 212, 93.0 162" fill="none" stroke="#2A2926" stroke-width="1.6" marker-end="url(#a)"/>
<text x="390.0" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#2A2926" text-anchor="middle" font-weight="400" font-style="normal">on hitting the bottom, scroll jumps to p - 0.95</text>
<text x="390.0" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8A857C" text-anchor="middle" font-weight="400" font-style="normal">and not a single pixel changes</text>
</svg>
