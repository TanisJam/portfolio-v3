<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 368" width="800" height="368" role="img" aria-label="Un disparo no tiene marcha atras. Un estado si.">
<title>Un disparo no tiene marcha atras. Un estado si.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2A2926"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2C9174"/></marker></defs>
<text x="26" y="26" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#2A2926" text-anchor="start" font-weight="700" font-style="normal">Un disparo no tiene marcha atras. Un estado si.</text>
<text x="26" y="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#8A857C" text-anchor="start" font-weight="400" font-style="normal">Arriba: el sonido se lanza al cruzar un umbral y corre contra el reloj del audio.</text>
<text x="26" y="64" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12.5" fill="#8A857C" text-anchor="start" font-weight="400" font-style="normal">Abajo: la ganancia sale de cuanto se esta moviendo la cosa en este instante.</text>
<text x="118" y="134" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2A2926" text-anchor="end" font-weight="700" font-style="normal">el lector</text>
<path d="M132 138 L362 110 L492 110 L632 142 L732 142" fill="none" stroke="#2A2926" stroke-width="2"/>
<text x="247" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8A857C" text-anchor="middle" font-weight="400" font-style="normal">avanza</text>
<text x="427" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8A857C" text-anchor="middle" font-weight="400" font-style="normal">frena</text>
<text x="572" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8A857C" text-anchor="middle" font-weight="400" font-style="normal">vuelve</text>
<text x="118" y="226" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#DD266E" text-anchor="end" font-weight="700" font-style="normal">evento</text>
<line x1="132" y1="250" x2="732" y2="250" stroke="#2A2926" stroke-width="1.2"/>
<line x1="292" y1="198" x2="292" y2="250" stroke="#DD266E" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="296" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#DD266E" text-anchor="start" font-weight="400" font-style="normal">umbral</text>
<path d="M292 250 L308 206 L404 244 L452 250" fill="#DD266E" opacity=".45"/>
<text x="472" y="222" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8A857C" text-anchor="start" font-weight="400" font-style="italic">termina solo, y el resto queda mudo</text>
<text x="472" y="238" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#8A857C" text-anchor="start" font-weight="400" font-style="italic">volviendo para atras no suena nada</text>
<text x="118" y="324" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2C9174" text-anchor="end" font-weight="700" font-style="normal">estado</text>
